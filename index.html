<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노트</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0a500">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 다크 테마 (기본) ────────────────────── */
    :root {
      --bg:        #111111;
      --sidebar:   #161616;
      --surface:   #1e1e1e;
      --hover:     #222222;
      --active:    #252525;
      --text:      #f0f0f0;
      --text-2:    #888888;
      --text-3:    #444444;
      --accent:    #f0a500;
      --accent-bg: rgba(240,165,0,0.10);
      --success:   #3a9e5a;
      --danger:    #e05252;
      --link:      #64b5f6;
    }

    /* ── 라이트 테마 ─────────────────────────── */
    [data-theme="light"] {
      --bg:        #f8f8f6;
      --sidebar:   #f0efe8;
      --surface:   #ffffff;
      --hover:     #ebebeb;
      --active:    #ffffff;
      --text:      #111111;
      --text-2:    #888888;
      --text-3:    #cccccc;
      --accent:    #c87800;
      --accent-bg: rgba(200,120,0,0.08);
      --success:   #2d8a4e;
      --danger:    #cc3333;
      --link:      #1a6fc4;
    }

    body {
      font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, color 0.2s;
    }

    /* ── 로그인 화면 ──────────────────────────── */
    #authScreen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box {
      width: 100%; max-width: 340px;
      background: var(--sidebar); border-radius: 20px; padding: 36px 30px;
    }
    .auth-logo { font-size: 20px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; }
    .auth-sub  { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
    .auth-tabs {
      display: flex; background: var(--hover);
      border-radius: 10px; padding: 3px; margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1; background: none; border: none; border-radius: 8px;
      color: var(--text-2); font-family: inherit; font-size: 13px;
      padding: 7px; cursor: pointer; transition: all 0.15s;
    }
    .auth-tab.active { background: var(--surface); color: var(--text); font-weight: 500; }
    .auth-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: block; }
    .auth-input {
      width: 100%; background: var(--hover); border: none;
      border-radius: 10px; color: var(--text); font-family: inherit;
      font-size: 14px; padding: 12px 14px; outline: none; margin-bottom: 12px;
      transition: background 0.15s;
    }
    .auth-input:focus { background: var(--active); box-shadow: 0 0 0 2px var(--accent); }
    .auth-btn {
      width: 100%; background: var(--accent); color: #000; border: none;
      border-radius: 10px; font-family: inherit; font-size: 14px;
      font-weight: 600; padding: 13px; cursor: pointer; margin-top: 4px;
      transition: opacity 0.15s;
    }
    .auth-btn:hover { opacity: 0.88; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error { font-size: 12px; color: var(--danger); margin-top: 10px; text-align: center; min-height: 18px; }

    /* ── 앱 레이아웃 ─────────────────────────── */
    #app { display: none; height: 100vh; overflow: hidden; }

    .app-layout {
      display: flex; height: 100vh;
    }

    /* ── 사이드바 ────────────────────────────── */
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--sidebar);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: background 0.2s;
    }

    .sidebar-top {
      padding: 20px 16px 12px;
      display: flex; align-items: center; gap: 10px;
    }

    .app-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 15px;
    }

    .app-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; flex: 1; }

    .icon-btn {
      background: none; border: none; color: var(--text-3);
      font-size: 16px; cursor: pointer; padding: 4px;
      border-radius: 6px; transition: color 0.15s; line-height: 1;
    }
    .icon-btn:hover { color: var(--text-2); }

    /* 검색 */
    .sidebar-search {
      padding: 0 12px 12px;
    }
    .search-input {
      width: 100%; background: var(--hover); border: none;
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 13px; padding: 8px 12px; outline: none;
      transition: background 0.15s;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { background: var(--active); }

    /* 태그 바 */
    .tag-bar {
      padding: 0 12px 8px;
      display: flex; gap: 5px; flex-wrap: wrap;
    }
    .tag-chip {
      background: none; border: none;
      border-radius: 6px; color: var(--text-2);
      font-family: inherit; font-size: 11px;
      padding: 3px 8px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tag-chip:hover { background: var(--hover); color: var(--text); }
    .tag-chip.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }

    /* 노트 목록 */
    .note-list {
      flex: 1; overflow-y: auto; padding: 0 8px;
    }
    .note-list::-webkit-scrollbar { width: 4px; }
    .note-list::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 4px; }

    .list-section-label {
      font-size: 11px; color: var(--text-3); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.6px;
      padding: 8px 8px 4px;
    }

    .note-item {
      padding: 10px 10px;
      border-radius: 10px; cursor: pointer;
      transition: background 0.12s;
      margin-bottom: 2px; position: relative;
    }
    .note-item:hover { background: var(--hover); }
    .note-item.active { background: var(--active); }

    .note-item-title {
      font-size: 13px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px; letter-spacing: -0.2px;
    }
    .note-item.active .note-item-title { color: var(--text); }
    .note-item-meta {
      font-size: 11px; color: var(--text-3);
      display: flex; align-items: center; gap: 6px;
    }

    .note-item-del {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-3);
      font-size: 13px; cursor: pointer; padding: 4px;
      border-radius: 4px; opacity: 0; transition: opacity 0.15s, color 0.15s;
    }
    .note-item:hover .note-item-del { opacity: 1; }
    .note-item-del:hover { color: var(--danger); }

    /* 사이드바 하단 */
    .sidebar-bottom {
      padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
    }

    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--hover); display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--text-2); flex-shrink: 0;
    }
    .user-email {
      font-size: 11px; color: var(--text-2); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 새 노트 버튼 */
    .new-note-btn {
      margin: 8px 12px 4px;
      background: var(--accent); color: #000; border: none;
      border-radius: 10px; font-family: inherit; font-size: 13px;
      font-weight: 600; padding: 10px; cursor: pointer;
      transition: opacity 0.15s; display: flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .new-note-btn:hover { opacity: 0.88; }

    /* ── 메인 에디터 패널 ────────────────────── */
    .editor-panel {
      flex: 1; background: var(--bg);
      display: flex; flex-direction: column; overflow: hidden;
      transition: background 0.2s;
    }

    /* 에디터 헤더 */
    .editor-header {
      padding: 16px 32px 0;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; min-height: 44px;
    }

    .editor-breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-3);
    }
    .bc-item {
      cursor: pointer; transition: color 0.15s;
      white-space: nowrap; max-width: 100px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .bc-item:hover { color: var(--text-2); }
    .bc-sep { opacity: 0.4; font-size: 11px; }

    .editor-meta {
      display: flex; align-items: center; gap: 12px;
    }
    .save-status { font-size: 12px; color: var(--text-3); transition: color 0.2s; }
    .save-status.saving { color: var(--accent); }
    .save-status.saved  { color: var(--success); }
    .save-status.error  { color: var(--danger); }

    /* 서식 툴바 */
    .fmt-toolbar {
      padding: 8px 32px;
      display: flex; gap: 1px; align-items: center; flex-wrap: wrap;
      flex-shrink: 0;
    }

    .fmt-btn {
      background: none; border: none; color: var(--text-2);
      font-family: inherit; font-size: 12px; padding: 5px 8px;
      border-radius: 6px; cursor: pointer; line-height: 1.4;
      min-width: 28px; text-align: center;
      transition: background 0.12s, color 0.12s;
    }
    .fmt-btn:hover { background: var(--hover); color: var(--text); }
    .fmt-btn.is-active { background: var(--accent-bg); color: var(--accent); }
    .fmt-sep { width: 1px; height: 14px; background: var(--hover); margin: 0 4px; flex-shrink: 0; }
    .fmt-color { width: 22px; height: 22px; border-radius: 5px; border: none; cursor: pointer; background: none; padding: 1px; }

    /* 노트 색상 */
    .nc-wrap { display: flex; gap: 4px; align-items: center; margin-left: auto; }
    .nc-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.12s; }
    .nc-dot:hover { transform: scale(1.2); }
    .nc-dot.active { border-color: var(--text); }
    .nc-custom { width: 16px; height: 16px; border-radius: 50%; overflow: hidden; cursor: pointer; }
    .nc-custom input[type="color"] { width: 22px; height: 22px; border: none; padding: 0; margin: -3px; }

    /* TipTap 에디터 */
    .editor-body {
      flex: 1; overflow-y: auto; padding: 4px 32px 40px;
    }
    .editor-body::-webkit-scrollbar { width: 5px; }
    .editor-body::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 4px; }

    .ProseMirror { outline: none; min-height: 400px; }
    .ProseMirror p { margin: 0.25em 0; line-height: 1.9; }
    .ProseMirror p.is-editor-empty:first-child::before {
      content: attr(data-placeholder); color: var(--text-3);
      float: left; height: 0; pointer-events: none;
    }
    .ProseMirror h1 { font-size: 2em; font-weight: 600; margin: 1em 0 0.4em; line-height: 1.3; letter-spacing: -0.5px; }
    .ProseMirror h2 { font-size: 1.4em; font-weight: 600; margin: 0.8em 0 0.3em; letter-spacing: -0.3px; }
    .ProseMirror h3 { font-size: 1.1em; font-weight: 600; margin: 0.6em 0 0.2em; }
    .ProseMirror strong { font-weight: 600; }
    .ProseMirror em { font-style: italic; }
    .ProseMirror u { text-decoration: underline; }
    .ProseMirror s { text-decoration: line-through; color: var(--text-2); }
    .ProseMirror mark { background: rgba(240,165,0,0.2); border-radius: 2px; padding: 0 2px; }
    .ProseMirror code {
      background: var(--hover); border-radius: 4px; padding: 1px 6px;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.87em; color: var(--accent);
    }
    .ProseMirror pre { background: var(--sidebar); border-radius: 10px; padding: 16px; overflow-x: auto; margin: 10px 0; }
    .ProseMirror pre code { background: none; color: var(--text); padding: 0; font-size: 13px; }
    .ProseMirror blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-2); font-style: italic; margin: 8px 0; }
    .ProseMirror hr { border: none; border-top: 1px solid var(--hover); margin: 20px 0; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 22px; margin: 4px 0; }
    .ProseMirror li { margin: 4px 0; line-height: 1.8; }
    .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
    .ProseMirror ul[data-type="taskList"] > li { display: flex; align-items: flex-start; gap: 8px; }
    .ProseMirror ul[data-type="taskList"] > li > label { margin-top: 4px; flex-shrink: 0; }
    .ProseMirror ul[data-type="taskList"] > li > label input { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }
    .ProseMirror ul[data-type="taskList"] > li[data-checked="true"] > div { text-decoration: line-through; color: var(--text-2); }
    .ProseMirror img { max-width: 100%; border-radius: 8px; margin: 8px 0; display: block; cursor: pointer; }
    .ProseMirror img.ProseMirror-selectednode { outline: 2px solid var(--accent); }
    .ProseMirror a { color: var(--link); text-decoration: underline; cursor: pointer; }
    .ProseMirror table { border-collapse: collapse; width: 100%; margin: 10px 0; table-layout: fixed; }
    .ProseMirror table td, .ProseMirror table th { border: 1px solid var(--hover); padding: 8px 12px; min-width: 80px; vertical-align: top; }
    .ProseMirror table th { background: var(--sidebar); font-weight: 600; }
    .ProseMirror .selectedCell:after { background: rgba(240,165,0,0.08); content: ""; left:0; right:0; top:0; bottom:0; pointer-events:none; position:absolute; z-index:2; }
    .ProseMirror .column-resize-handle { background: var(--accent); bottom:-2px; position:absolute; right:-2px; pointer-events:none; top:0; width:3px; opacity:0; transition:opacity 0.2s; }
    .ProseMirror table:hover .column-resize-handle { opacity: 1; }
    .ProseMirror.resize-cursor { cursor: col-resize; }

    /* 태그/링크 노드 */
    .tag-mention {
      display: inline-block; background: var(--accent-bg); color: var(--accent);
      border-radius: 4px; padding: 0 6px; font-size: 0.87em; font-weight: 500;
      cursor: pointer; transition: background 0.12s; outline: none !important;
    }
    .tag-mention:hover { background: rgba(240,165,0,0.2); }
    .internal-link-mention {
      color: var(--link); border-bottom: 1px solid transparent;
      cursor: pointer; padding: 0 1px; outline: none !important;
      transition: border-color 0.12s;
    }
    .internal-link-mention:hover { border-bottom-color: var(--link); }

    /* 에디터 빈 상태 */
    .editor-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--text-3); gap: 12px; padding: 40px;
      text-align: center;
    }
    .editor-empty-icon { font-size: 48px; opacity: 0.3; }
    .editor-empty-text { font-size: 14px; line-height: 1.8; }

    /* ── 버블 메뉴 ───────────────────────────── */
    .bubble-menu {
      display: none; position: fixed; z-index: 200;
      background: var(--sidebar); border-radius: 10px; padding: 4px 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); gap: 2px; align-items: center;
    }
    .bubble-menu.show { display: flex; }
    .bubble-btn { background: none; border: none; color: var(--text-2); font-size: 12px; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 26px; text-align: center; transition: background 0.12s, color 0.12s; }
    .bubble-btn:hover { background: var(--hover); color: var(--text); }
    .bubble-btn.is-active { color: var(--accent); background: var(--accent-bg); }

    /* ── 자동완성 팝업 ───────────────────────── */
    .suggestion-popup {
      position: fixed; z-index: 500; background: var(--sidebar);
      border-radius: 12px; padding: 6px; min-width: 200px; max-width: 300px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35); display: none;
    }
    .suggestion-popup.show { display: block; }
    .suggestion-popup-header { font-size: 10px; color: var(--text-3); padding: 4px 10px 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .suggestion-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; transition: background 0.1s, color 0.1s; }
    .suggestion-item:hover, .suggestion-item.selected { background: var(--hover); color: var(--text); }
    .sug-icon { font-size: 12px; width: 16px; text-align: center; flex-shrink: 0; color: var(--accent); }

    /* ── 우클릭 컨텍스트 메뉴 ───────────────── */
    .ctx-menu {
      position: fixed; z-index: 300; background: var(--sidebar);
      border-radius: 12px; padding: 6px; min-width: 190px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35); display: none;
    }
    .ctx-menu.show { display: block; }
    .ctx-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; transition: background 0.1s, color 0.1s; font-family: inherit; }
    .ctx-item:hover { background: var(--hover); color: var(--text); }
    .ctx-item.danger:hover { color: var(--danger); }
    .ctx-icon { font-size: 13px; width: 20px; text-align: center; flex-shrink: 0; }
    .ctx-divider { border: none; border-top: 1px solid var(--hover); margin: 4px 0; }

    /* ── 이미지 리사이즈 오버레이 ───────────────── */
    .img-overlay {
      position: fixed; z-index: 350; display: none; pointer-events: none;
    }
    .img-overlay.show { display: block; }
    .img-overlay-border {
      position: absolute; inset: -2px;
      border: 2px solid var(--accent); border-radius: 3px; pointer-events: none;
    }
    .rh {
      position: absolute; width: 14px; height: 14px;
      background: #fff; border: 2px solid var(--accent);
      border-radius: 50%; pointer-events: all;
      transform: translate(-50%, -50%);
    }
    .rh:hover { background: var(--accent); transform: translate(-50%, -50%) scale(1.2); }
    .rh-nw { left:0;   top:0;    cursor: nw-resize; }
    .rh-n  { left:50%; top:0;    cursor: n-resize; }
    .rh-ne { left:100%; top:0;   cursor: ne-resize; }
    .rh-e  { left:100%; top:50%; cursor: e-resize; }
    .rh-se { left:100%; top:100%;cursor: se-resize; }
    .rh-s  { left:50%; top:100%; cursor: s-resize; }
    .rh-sw { left:0;   top:100%; cursor: sw-resize; }
    .rh-w  { left:0;   top:50%;  cursor: w-resize; }
    .img-size-tip {
      position: fixed; z-index: 360; background: rgba(0,0,0,0.75); color: #fff;
      border-radius: 5px; padding: 3px 8px; font-size: 11px;
      pointer-events: none; display: none; white-space: nowrap;
    }
    .img-size-tip.show { display: block; }
    .img-resize-bar {
      position: fixed; z-index: 400; display: none; background: var(--sidebar);
      border-radius: 8px; padding: 4px 6px; gap: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3); align-items: center;
    }
    .img-resize-bar.show { display: flex; }
    .img-sz-btn { background: none; border: none; color: var(--text-2); font-size: 11px; padding: 3px 8px; border-radius: 5px; cursor: pointer; font-family: inherit; transition: background 0.12s, color 0.12s; }
    .img-sz-btn:hover { background: var(--hover); color: var(--text); }
    .img-sz-btn.active { background: var(--accent-bg); color: var(--accent); }

    /* ── 테마 토글 ───────────────────────────── */
    .theme-toggle {
      background: none; border: none; color: var(--text-3);
      font-size: 15px; cursor: pointer; padding: 4px;
      border-radius: 6px; transition: color 0.15s; line-height: 1;
    }
    .theme-toggle:hover { color: var(--text-2); }

    /* ── 토스트 ──────────────────────────────── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--sidebar); border-radius: 10px; padding: 9px 18px; font-size: 13px; transition: transform 0.3s; z-index: 999; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.err { color: var(--danger); }

    /* ── 모바일 ──────────────────────────────── */
    @media (max-width: 640px) {
      .sidebar { width: 100%; position: fixed; z-index: 50; height: 100vh; left: -100%; transition: left 0.25s; }
      .sidebar.mobile-open { left: 0; }
      .editor-panel { width: 100%; }
      .fmt-toolbar { padding: 8px 16px; }
      .editor-body { padding: 4px 16px 40px; }
      .editor-header { padding: 12px 16px 0; }
      .nc-wrap { display: none; }
    }
  </style>
</head>
<body>

<!-- ══ 로그인 ══ -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">📝 노트</div>
    <div class="auth-sub">어디서든 내 노트를 꺼내요</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">로그인</button>
      <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">회원가입</button>
    </div>

<script type="module">
  const BASE = 'https://esm.sh/@tiptap';
  const { Editor, Node: TNode, InputRule, mergeAttributes } = await import(`${BASE}/core@2.11.5`);
  const { default: SK }  = await import(`${BASE}/starter-kit@2.11.5`);
  const { default: UL }  = await import(`${BASE}/extension-underline@2.11.5`);
  const { default: TA }  = await import(`${BASE}/extension-text-align@2.11.5`);
  const { default: HL }  = await import(`${BASE}/extension-highlight@2.11.5`);
  const { default: TS }  = await import(`${BASE}/extension-text-style@2.11.5`);
  const { default: CL }  = await import(`${BASE}/extension-color@2.11.5`);
  const { default: TL }  = await import(`${BASE}/extension-task-list@2.11.5`);
  const { default: TI }  = await import(`${BASE}/extension-task-item@2.11.5`);
  const { default: IMG } = await import(`${BASE}/extension-image@2.11.5`);
  const { default: LNK } = await import(`${BASE}/extension-link@2.11.5`);
  const { default: TBL } = await import(`${BASE}/extension-table@2.11.5`);
  const { default: TR }  = await import(`${BASE}/extension-table-row@2.11.5`);
  const { default: TC }  = await import(`${BASE}/extension-table-cell@2.11.5`);
  const { default: TH }  = await import(`${BASE}/extension-table-header@2.11.5`);
  const { default: PH }  = await import(`${BASE}/extension-placeholder@2.11.5`);

  const sb = window.supabase.createClient(
    'https://fiilawtgnsygjijfucpe.supabase.co',
    'sb_publishable_klauYsbGxSWPZYIi1rMGmA_QgVpBT8r'
  );

  // ── 상태 ────────────────────────────────────────────────
  let notes         = [];
  let currentUser   = null;
  let currentNoteId = null;
  let currentColor  = null;
  let autoSaveTimer = null;
  let isLoginMode   = true;
  let activeTagFilter = null;
  let navStack      = [];
  let editor        = null;
  let linkDropRange = null;
  let isDark        = localStorage.getItem('theme') !== 'light';

  const NOTE_COLORS = [
    { color: null,      label: '기본' },
    { color: '#e05252', label: '빨강' },
    { color: '#e07a30', label: '주황' },
    { color: '#d4a017', label: '노랑' },
    { color: '#3a9e5a', label: '초록' },
    { color: '#3a7ae0', label: '파랑' },
    { color: '#9b52e0', label: '보라' },
  ];

  // ── 테마 ─────────────────────────────────────────────────
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.querySelector('.theme-toggle').textContent = isDark ? '☀' : '🌙';
  }
  window.toggleTheme = function() {
    isDark = !isDark;
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    applyTheme();
  };
  applyTheme();

  // ── 커스텀 노드 정의 ─────────────────────────────────────
  const TagNode = TNode.create({
    name: 'tag', group: 'inline', inline: true, atom: true, selectable: true,
    addAttributes() {
      return { label: { default: null, parseHTML: el => el.getAttribute('data-label'), renderHTML: attrs => ({ 'data-label': attrs.label }) } };
    },
    parseHTML()  { return [{ tag: 'span[data-type="tag"]' }]; },
    renderHTML({ node }) {
      return ['span', { 'data-type': 'tag', 'data-label': node.attrs.label, class: 'tag-mention' }, '#' + (node.attrs.label || '')];
    },
    addInputRules() {
      return [new InputRule({
        find: /#([\w가-힣]+)\s$/,
        handler({ state, range, match, chain }) {
          chain().deleteRange(range).insertContentAt(range.from, [{ type: 'tag', attrs: { label: match[1] } }, { type: 'text', text: ' ' }]).run();
        },
      })];
    },
  });

  const InternalLinkNode = TNode.create({
    name: 'internalLink', group: 'inline', inline: true, atom: true, selectable: true,
    addAttributes() {
      return {
        id:    { default: null, parseHTML: el => el.getAttribute('data-id'),    renderHTML: attrs => ({ 'data-id': attrs.id }) },
        label: { default: null, parseHTML: el => el.getAttribute('data-label'), renderHTML: attrs => ({ 'data-label': attrs.label }) },
      };
    },
    parseHTML()  { return [{ tag: 'span[data-type="internalLink"]' }]; },
    renderHTML({ node }) {
      return ['span', { 'data-type': 'internalLink', 'data-id': node.attrs.id, 'data-label': node.attrs.label, class: 'internal-link-mention' }, '[[' + (node.attrs.label || '') + ']]'];
    },
    addInputRules() {
      return [new InputRule({
        find: /\[\[([^\]]+)\]\]$/,
        handler({ state, range, match, chain }) {
          const label = match[1];
          const note  = notes.find(n => (n.title||'').toLowerCase() === label.toLowerCase());
          chain().deleteRange(range).insertContentAt(range.from, [{ type: 'internalLink', attrs: { id: note?.id || null, label } }, { type: 'text', text: ' ' }]).run();
        },
      })];
    },
  });

  // ── 이미지 확장 ──────────────────────────────────────────
  const ResizableImage = IMG.extend({
    addAttributes() {
      return { ...this.parent?.(), width: { default: null, parseHTML: el => el.style.width || null, renderHTML: attrs => attrs.width ? { style: `width:${attrs.width}; max-width:100%; display:block` } : {} } };
    },
  });

  // ── TipTap 초기화 ────────────────────────────────────────
  function initEditor() {
    if (editor) return;
    editor = new Editor({
      element: document.getElementById('editorEl'),
      extensions: [
        SK.configure({ heading: { levels: [1,2,3] } }),
        UL, TA.configure({ types: ['heading','paragraph'] }),
        HL.configure({ multicolor: true }), TS, CL, TL,
        TI.configure({ nested: true }),
        ResizableImage.configure({ inline: false, allowBase64: false }),
        LNK.configure({ openOnClick: false, HTMLAttributes: { target: '_blank' } }),
        TBL.configure({ resizable: true }), TR, TC, TH,
        PH.configure({ placeholder: '내용을 입력하세요...\n\n#태그  [[내부링크]]  **굵게**  # 제목' }),
        TagNode, InternalLinkNode,
      ],
      content: '',
      onUpdate: () => {
        updateToolbarState();
        checkLinkTrigger();
        const html = editor.getHTML();
        const hasContent = html !== '<p></p>' && html.trim() !== '';
        clearTimeout(autoSaveTimer);
        if (hasContent) {
          setStatus('typing');
          autoSaveTimer = setTimeout(autoSave, 2000);
        } else { setStatus(''); }
      },
      onSelectionUpdate: () => { updateToolbarState(); updateBubbleMenu(); },
      onFocus: () => updateBubbleMenu(),
      onBlur:  () => setTimeout(hideBubbleMenu, 200),
    });

    // ── 이미지 리사이즈 오버레이 (8방향) ───────────────────
    let selectedImg = null, resizeDir = null;
    let rsStartX = 0, rsStartY = 0, rsStartW = 0, rsStartH = 0, rsStartL = 0, rsStartT = 0;
    const overlay = document.getElementById('imgOverlay');
    const rsTip   = document.getElementById('imgSizeTip');
    const rsBar   = document.getElementById('imgResizeBar');

    function positionOverlay(img) {
      if (!img) return;
      const r = img.getBoundingClientRect();
      overlay.style.left   = r.left   + 'px';
      overlay.style.top    = r.top    + 'px';
      overlay.style.width  = r.width  + 'px';
      overlay.style.height = r.height + 'px';
      // 버튼 바 위치
      rsBar.style.left = r.left + 'px';
      rsBar.style.top  = (r.bottom + 6) + 'px';
      rsBar.classList.add('show');
    }

    // 이미지 클릭 → 오버레이 표시
    editor.view.dom.addEventListener('click', e => {
      const img = e.target.closest('img');
      if (img) {
        selectedImg = img;
        positionOverlay(img);
        overlay.classList.add('show');
      } else if (!e.target.closest('#imgOverlay') && !e.target.closest('#imgResizeBar')) {
        overlay.classList.remove('show');
        rsBar.classList.remove('show');
        selectedImg = null;
      }
    });

    // 핸들 드래그 시작
    overlay.querySelectorAll('.rh').forEach(handle => {
      handle.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation();
        if (!selectedImg) return;
        resizeDir = handle.dataset.dir;
        rsStartX  = e.clientX; rsStartY = e.clientY;
        rsStartW  = selectedImg.offsetWidth;
        rsStartH  = selectedImg.offsetHeight;
        document.body.style.userSelect = 'none';
        document.body.style.cursor = getComputedStyle(handle).cursor;
      });
    });

    // 스크롤로 리사이즈 (비율 유지)
    editor.view.dom.addEventListener('wheel', e => {
      const img = e.target.closest('img'); if (!img) return;
      e.preventDefault();
      const ratio  = img.naturalHeight / img.naturalWidth;
      const newW   = Math.max(50, img.offsetWidth + (e.deltaY < 0 ? 20 : -20));
      const newH   = Math.round(newW * ratio);
      applyImgResize(img, newW, newH);
    }, { passive: false });

    // 드래그 중
    document.addEventListener('mousemove', e => {
      if (!resizeDir || !selectedImg) return;
      const dx = e.clientX - rsStartX;
      const dy = e.clientY - rsStartY;
      let newW = rsStartW, newH = rsStartH;
      if (resizeDir.includes('e'))  newW = Math.max(50, rsStartW + dx);
      if (resizeDir.includes('w'))  newW = Math.max(50, rsStartW - dx);
      if (resizeDir.includes('s'))  newH = Math.max(30, rsStartH + dy);
      if (resizeDir.includes('n'))  newH = Math.max(30, rsStartH - dy);
      selectedImg.style.width    = newW + 'px';
      selectedImg.style.height   = newH + 'px';
      selectedImg.style.maxWidth = 'none';
      selectedImg.style.display  = 'block';
      positionOverlay(selectedImg);
      rsTip.textContent = `${Math.round(newW)} × ${Math.round(newH)}`;
      rsTip.style.left = (e.clientX + 12) + 'px';
      rsTip.style.top  = (e.clientY - 28) + 'px';
      rsTip.classList.add('show');
    });

    // 드래그 끝 → TipTap에 저장
    document.addEventListener('mouseup', () => {
      if (!resizeDir || !selectedImg) return;
      applyImgResize(selectedImg, selectedImg.offsetWidth, selectedImg.offsetHeight);
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      rsTip.classList.remove('show');
      resizeDir = null;
      positionOverlay(selectedImg);
    });

    function applyImgResize(img, w, h) {
      img.style.width    = w + 'px';
      img.style.height   = h + 'px';
      img.style.maxWidth = 'none';
      img.style.display  = 'block';
      if (editor) editor.chain().focus().updateAttributes('image', {
        style: `width:${w}px; height:${h}px; max-width:none; display:block`
      }).run();
      if (selectedImg === img) positionOverlay(img);
    }

    // 태그/링크 클릭
    editor.view.dom.addEventListener('click', e => {
      const tag  = e.target.closest('[data-type="tag"]');
      const link = e.target.closest('[data-type="internalLink"]');
      if (tag)  { const l = tag.getAttribute('data-label');  if (l) { filterByTag(l); } }
      if (link) { const id = link.getAttribute('data-id');   if (id) openLinkedNote(id); }
    });

    // [[ 드롭다운 키보드
    editor.view.dom.addEventListener('keydown', e => {
      const popup = document.getElementById('suggestionPopup');
      if (!popup.classList.contains('show')) return;
      const items = [...popup.querySelectorAll('.suggestion-item[data-i]')];
      const sel = popup.querySelector('.suggestion-item.selected');
      const idx = sel ? +sel.dataset.i : -1;
      if (e.key === 'ArrowDown')  { e.preventDefault(); const n = Math.min(items.length-1, idx+1); items.forEach((el,i) => el.classList.toggle('selected', i===n)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); const n = Math.max(0, idx-1); items.forEach((el,i) => el.classList.toggle('selected', i===n)); }
      else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); items[idx].dispatchEvent(new MouseEvent('mousedown')); }
      else if (e.key === 'Escape') hideLinkDropdown();
    }, true);

    // 우클릭
    document.getElementById('editorEl').addEventListener('contextmenu', e => {
      e.preventDefault();
      const menu = document.getElementById('ctxMenu');
      const inTable = editor && editor.isActive('table');
      document.getElementById('ctxTableSection').style.display   = inTable ? 'block' : 'none';
      document.getElementById('ctxGeneralSection').style.display = inTable ? 'none'  : 'block';
      const x = Math.min(e.clientX, window.innerWidth - 210);
      const y = Math.min(e.clientY, window.innerHeight - 360);
      menu.style.left = Math.max(8, x)+'px'; menu.style.top = Math.max(8, y)+'px';
      menu.classList.add('show');
    });

    // 이미지 붙여넣기
    document.getElementById('editorEl').addEventListener('paste', async e => {
      const items = e.clipboardData?.items; if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault(); showToast('업로드 중...');
          const url = await uploadImage(item.getAsFile());
          if (url && editor) { editor.chain().focus().setImage({ src: url }).insertContentAt(editor.state.doc.content.size, { type: 'paragraph' }).focus(editor.state.doc.content.size).run(); showToast('이미지 추가됐습니다 ✓'); }
          return;
        }
      }
    });
  }

  // ── 툴바 ─────────────────────────────────────────────────
  function updateToolbarState() {
    if (!editor) return;
    const map = {
      'btn-bold': ()=>editor.isActive('bold'), 'btn-italic': ()=>editor.isActive('italic'),
      'btn-underline': ()=>editor.isActive('underline'), 'btn-strike': ()=>editor.isActive('strike'),
      'btn-highlight': ()=>editor.isActive('highlight'),
      'btn-h1': ()=>editor.isActive('heading',{level:1}), 'btn-h2': ()=>editor.isActive('heading',{level:2}), 'btn-h3': ()=>editor.isActive('heading',{level:3}),
      'btn-left': ()=>editor.isActive({textAlign:'left'}), 'btn-center': ()=>editor.isActive({textAlign:'center'}), 'btn-right': ()=>editor.isActive({textAlign:'right'}),
      'btn-ul': ()=>editor.isActive('bulletList'), 'btn-ol': ()=>editor.isActive('orderedList'), 'btn-task': ()=>editor.isActive('taskList'),
      'btn-quote': ()=>editor.isActive('blockquote'), 'btn-code': ()=>editor.isActive('code'), 'btn-codeblock': ()=>editor.isActive('codeBlock'),
    };
    Object.entries(map).forEach(([id,fn]) => document.getElementById(id)?.classList.toggle('is-active', fn()));
    ['bb-bold','bb-italic','bb-underline','bb-strike','bb-highlight'].forEach(id => {
      document.getElementById(id)?.classList.toggle('is-active', editor.isActive(id.replace('bb-','')));
    });
    const inTable = editor.isActive('table');
    ['btn-addColAfter','btn-addRowAfter','btn-deleteTable'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = inTable ? 'inline-block' : 'none';
    });
  }

  // ── 버블 메뉴 ────────────────────────────────────────────
  function updateBubbleMenu() {
    if (!editor) return;
    const { from, empty } = editor.state.selection;
    const menu = document.getElementById('bubbleMenu');
    if (empty) { menu.classList.remove('show'); return; }
    const coords = editor.view.coordsAtPos(from);
    menu.style.left = Math.min(coords.left, window.innerWidth-260)+'px';
    menu.style.top  = Math.max(8, coords.top-46)+'px';
    menu.classList.add('show');
    updateToolbarState();
  }
  function hideBubbleMenu() { document.getElementById('bubbleMenu').classList.remove('show'); }

  // ── 툴바 명령 ────────────────────────────────────────────
  window.execCmd = function(cmd, val) {
    if (!editor) return;
    const c = editor.chain().focus();
    switch(cmd) {
      case 'bold':         c.toggleBold().run(); break;
      case 'italic':       c.toggleItalic().run(); break;
      case 'underline':    c.toggleUnderline().run(); break;
      case 'strike':       c.toggleStrike().run(); break;
      case 'highlight':    c.toggleHighlight().run(); break;
      case 'h1':           c.toggleHeading({level:1}).run(); break;
      case 'h2':           c.toggleHeading({level:2}).run(); break;
      case 'h3':           c.toggleHeading({level:3}).run(); break;
      case 'left':         c.setTextAlign('left').run(); break;
      case 'center':       c.setTextAlign('center').run(); break;
      case 'right':        c.setTextAlign('right').run(); break;
      case 'ul':           c.toggleBulletList().run(); break;
      case 'ol':           c.toggleOrderedList().run(); break;
      case 'task':         c.toggleTaskList().run(); break;
      case 'quote':        c.toggleBlockquote().run(); break;
      case 'code':         c.toggleCode().run(); break;
      case 'codeblock':    c.toggleCodeBlock().run(); break;
      case 'hr':           c.setHorizontalRule().run(); break;
      case 'table':        c.insertTable({rows:3,cols:3,withHeaderRow:true}).run(); break;
      case 'addColAfter':  c.addColumnAfter().run(); break;
      case 'addRowAfter':  c.addRowAfter().run(); break;
      case 'deleteTable':  c.deleteTable().run(); break;
      case 'color':        c.setColor(val).run(); break;
      case 'link': { const url = prompt('링크 URL:', 'https://'); if (url) c.setLink({href:url}).run(); else c.unsetLink().run(); break; }
    }
    updateToolbarState();
  };

  // ── 이미지 크기 ──────────────────────────────────────────
  window.setImgSize = function(val) {
    if (!editor || !selectedImg) return;
    if (val === 'ratio') {
      // 원본 비율로 복원
      const ratio = selectedImg.naturalHeight / selectedImg.naturalWidth;
      const w = selectedImg.offsetWidth;
      applyImgResize(selectedImg, w, Math.round(w * ratio));
    } else {
      const editorW = document.getElementById('editorEl').clientWidth - 64;
      const ratio   = selectedImg.naturalHeight / selectedImg.naturalWidth;
      const newW    = Math.round(editorW * val / 100);
      const newH    = Math.round(newW * ratio);
      applyImgResize(selectedImg, newW, newH);
    }
    document.querySelectorAll('.img-sz-btn').forEach(b => b.classList.remove('active'));
    if (typeof val === 'number') {
      document.querySelector(`.img-sz-btn[onclick="setImgSize(${val})"]`)?.classList.add('active');
    }
  };

  // ── 우클릭 메뉴 ──────────────────────────────────────────
  window.hideCtxMenu = function() { document.getElementById('ctxMenu').classList.remove('show'); };
  document.addEventListener('click', () => window.hideCtxMenu());
  window.ctxCmd = function(cmd) {
    window.hideCtxMenu(); if (!editor) return;
    const c = editor.chain().focus();
    switch(cmd) {
      case 'addRowBefore':    c.addRowBefore().run();    break;
      case 'addRowAfter':     c.addRowAfter().run();     break;
      case 'deleteRow':       c.deleteRow().run();       break;
      case 'addColumnBefore': c.addColumnBefore().run(); break;
      case 'addColumnAfter':  c.addColumnAfter().run();  break;
      case 'deleteColumn':    c.deleteColumn().run();    break;
      case 'mergeCells':      c.mergeCells().run();      break;
      case 'splitCell':       c.splitCell().run();       break;
      case 'toggleHeaderRow': c.toggleHeaderRow().run(); break;
      case 'deleteTable':     c.deleteTable().run();     break;
    }
  };

  // ── 이미지 업로드 ────────────────────────────────────────
  async function compressImage(file, maxPx=1920, quality=0.85) {
    return new Promise(resolve => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxPx || h > maxPx) { if (w>h) { h=Math.round(h*maxPx/w); w=maxPx; } else { w=Math.round(w*maxPx/h); h=maxPx; } }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
        const type = file.type==='image/png' ? 'image/png' : 'image/jpeg';
        c.toBlob(blob => resolve(blob||file), type, quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function uploadImage(file) {
    if (!file || file.size > 10000000) { showToast('10MB 이하만 가능해요', true); return null; }
    showToast('압축 중...');
    const compressed = await compressImage(file);
    const ext  = file.type==='image/png' ? 'png' : 'jpg';
    const path = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('note-images').upload(path, compressed, { upsert: true, contentType: compressed.type });
    if (error) { showToast('업로드 실패', true); return null; }
    return sb.storage.from('note-images').getPublicUrl(path).data.publicUrl;
  }

  window.insertImage = async function(fileInput) {
    const file = fileInput.files[0]; if (!file) return;
    showToast('업로드 중...');
    const url = await uploadImage(file);
    if (url && editor) { editor.chain().focus().setImage({src:url}).insertContentAt(editor.state.doc.content.size, {type:'paragraph'}).focus(editor.state.doc.content.size).run(); showToast('이미지 추가됐습니다 ✓'); }
    fileInput.value = '';
  };

  // ── 자동저장 ─────────────────────────────────────────────
  function setStatus(state) {
    const map = {'':['',''], typing:['','작성 중...'], saving:['saving','저장 중...'], saved:['saved','✓ 저장됨'], error:['error','⚠ 저장 실패']};
    const [cls, text] = map[state]||['',''];
    const el = document.getElementById('saveStatus');
    el.className = 'save-status '+cls; el.textContent = text;
  }

  async function autoSave() {
    if (!editor || !currentUser) return;
    const html = editor.getHTML();
    const hasContent = html !== '<p></p>' && html.trim() !== '';
    if (!hasContent) return;
    setStatus('saving');
    const plain = editor.getText().trim();
    const title = plain ? plain.split('\n')[0].trim().slice(0,50) : '제목 없음';

    if (!currentNoteId) {
      const { data, error } = await sb.from('notes').insert([{ title, content: html, user_id: currentUser.id, color: currentColor }]).select().single();
      if (error) { setStatus('error'); return; }
      currentNoteId = data.id;
      notes.unshift(data);
    } else {
      const { data, error } = await sb.from('notes').update({ title, content: html, updated_at: new Date().toISOString(), color: currentColor }).eq('id', currentNoteId).select().single();
      if (error) { setStatus('error'); return; }
      const idx = notes.findIndex(n => n.id === currentNoteId);
      if (idx !== -1) notes[idx] = data;
    }
    setStatus('saved');
    renderList();
  }

  // ── 노트 색상 ────────────────────────────────────────────
  function buildColorPicker() {
    const wrap = document.getElementById('noteColorWrap');
    wrap.innerHTML = NOTE_COLORS.map(nc => `
      <div class="nc-dot ${currentColor===nc.color?'active':''}"
           style="${nc.color ? `background:${nc.color}` : 'background:var(--hover)'}"
           onclick="window.setNoteColor(${nc.color?`'${nc.color}'`:'null'})"
           title="${nc.label}"></div>
    `).join('') + `<div class="nc-custom" title="직접 선택"><input type="color" value="${currentColor||'#3a7ae0'}" onchange="window.setNoteColor(this.value)"></div>`;
  }

  window.setNoteColor = async function(color) {
    currentColor = color;
    buildColorPicker();
    if (currentNoteId) {
      await sb.from('notes').update({ color }).eq('id', currentNoteId);
      const note = notes.find(n => n.id === currentNoteId);
      if (note) { note.color = color; renderList(); }
    }
  };

  // ── 에디터 패널 표시/숨김 ────────────────────────────────
  function showEditorPanel(show) {
    document.getElementById('editorHeader').style.display = show ? 'flex' : 'none';
    document.getElementById('fmtToolbar').style.display   = show ? 'flex' : 'none';
    document.getElementById('editorBody').style.display   = show ? 'block' : 'none';
    document.getElementById('editorEmpty').style.display  = show ? 'none' : 'flex';
  }

  // ── 노트 열기 ────────────────────────────────────────────
  function openNote(noteId, fromLink = false) {
    if (!editor) initEditor();
    if (fromLink && currentNoteId && currentNoteId !== noteId) {
      const cur = notes.find(n => n.id === currentNoteId);
      navStack.push({ id: currentNoteId, title: cur?.title || '이전 노트' });
    }
    if (!fromLink) navStack = [];
    currentNoteId = noteId;
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    currentColor = note.color || null;
    const content = note.content || '';
    editor.commands.setContent(content.trim().startsWith('<') ? content : `<p>${content.replace(/\n/g,'</p><p>')}</p>`);
    setStatus('');
    buildColorPicker();
    showEditorPanel(true);
    updateBreadcrumb();
    renderList();
    setTimeout(() => editor.commands.focus(), 50);
  }

  function openLinkedNote(noteId) { openNote(noteId, true); }

  window.newNote = function() {
    if (!editor) initEditor();
    navStack = [];
    currentNoteId = null;
    currentColor  = null;
    editor.commands.clearContent();
    setStatus('');
    buildColorPicker();
    showEditorPanel(true);
    updateBreadcrumb();
    renderList();
    setTimeout(() => editor.commands.focus(), 50);
  };

  function updateBreadcrumb() {
    const bc = document.getElementById('editorBreadcrumb');
    if (!navStack.length) { bc.innerHTML = ''; return; }
    bc.innerHTML = navStack.map((item, i) => `
      <span class="bc-item" onclick="goBackTo(${i})">${escHtml(item.title.slice(0,12))}${item.title.length>12?'…':''}</span>
      <span class="bc-sep">›</span>
    `).join('');
  }

  window.goBack = function() { if (!navStack.length) return; const prev = navStack.pop(); openNote(prev.id, false); navStack = navStack.slice(0, -1); };
  window.goBackTo = function(idx) { const target = navStack[idx]; navStack = navStack.slice(0, idx); openNote(target.id, false); };

  // ── DB ───────────────────────────────────────────────────
  async function loadNotes() {
    const { data, error } = await sb.from('notes').select('*').order('created_at', { ascending: false });
    if (error) { showToast('불러오기 실패', true); return; }
    notes = data; renderList();
  }

  window.deleteNote = async function(id, e) {
    e?.stopPropagation();
    if (!confirm('삭제할까요?')) return;
    const { error } = await sb.from('notes').delete().eq('id', id);
    if (error) { showToast('삭제 실패', true); return; }
    notes = notes.filter(n => n.id !== id);
    if (currentNoteId === id) { currentNoteId = null; showEditorPanel(false); }
    renderList();
    showToast('삭제됐습니다');
  };

  // ── 태그 ─────────────────────────────────────────────────
  function extractTagsFromHtml(html) {
    if (!html) return [];
    const div = document.createElement('div'); div.innerHTML = html;
    const nodes = div.querySelectorAll('[data-type="tag"]');
    if (nodes.length) return [...nodes].map(n => n.getAttribute('data-label')||'').filter(Boolean);
    return [...new Set((div.textContent.match(/#([\w가-힣]+)/g)||[]).map(t=>t.slice(1)))];
  }

  function filterByTag(tag) {
    activeTagFilter = (activeTagFilter === tag) ? null : tag;
    renderList();
  }
  window.filterByTag = filterByTag;

  // ── [[ 드롭다운 ───────────────────────────────────────────
  function checkLinkTrigger() {
    if (!editor) return;
    const { from } = editor.state.selection;
    const before = editor.state.doc.textBetween(Math.max(0, from-80), from, null, '\ufffc');
    const match  = before.match(/\[\[([^\]]*)$/);
    if (match) showLinkDropdown(match[1], from-match[1].length-2, from);
    else hideLinkDropdown();
  }

  function showLinkDropdown(query, triggerFrom, cursorPos) {
    const filtered = notes.filter(n => (n.title||'').toLowerCase().includes(query.toLowerCase())).slice(0,8);
    const popup = document.getElementById('suggestionPopup');
    if (!filtered.length) { hideLinkDropdown(); return; }
    popup.innerHTML = '<div class="suggestion-popup-header">[[  노트 링크</div>' +
      filtered.map((n,i) => `<div class="suggestion-item" data-i="${i}"><span class="sug-icon">📝</span>${escHtml(n.title||'제목 없음')}</div>`).join('');
    linkDropRange = { from: triggerFrom, to: cursorPos };
    popup.querySelectorAll('.suggestion-item[data-i]').forEach(el => {
      el.addEventListener('mousedown', e => { e.preventDefault(); insertInternalLink(filtered[+el.dataset.i], linkDropRange.from, linkDropRange.to); });
    });
    try {
      const coords = editor.view.coordsAtPos(Math.min(cursorPos, editor.state.doc.content.size));
      popup.style.left = Math.min(coords.left, window.innerWidth-230)+'px';
      popup.style.top  = Math.min(coords.bottom+6, window.innerHeight-300)+'px';
    } catch {}
    popup.classList.add('show');
  }

  function hideLinkDropdown() { document.getElementById('suggestionPopup').classList.remove('show'); linkDropRange = null; }

  function insertInternalLink(note, from, to) {
    editor.chain().focus().deleteRange({from,to}).insertContentAt(from, [{ type:'internalLink', attrs:{ id:note.id, label:note.title||'제목 없음' } }, {type:'text',text:' '}]).run();
    hideLinkDropdown();
  }

  // ── 렌더링 ──────────────────────────────────────────────
  function stripHtml(html) { const d=document.createElement('div'); d.innerHTML=html; return d.textContent||''; }

  function formatDate(iso) {
    if (!iso) return '';
    const d=new Date(iso), diff=Date.now()-d;
    if (diff<60000)     return '방금 전';
    if (diff<3600000)   return Math.floor(diff/60000)+'분 전';
    if (diff<86400000)  return Math.floor(diff/3600000)+'시간 전';
    if (diff<604800000) return Math.floor(diff/86400000)+'일 전';
    return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  }

  function escHtml(t) { return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderList() {
    const q = document.getElementById('search').value.toLowerCase();
    let filtered = notes.filter(n => {
      const match = (n.title||'').toLowerCase().includes(q) || stripHtml(n.content||'').toLowerCase().includes(q);
      if (!match) return false;
      if (activeTagFilter) return extractTagsFromHtml(n.content).includes(activeTagFilter);
      return true;
    });

    // 태그 바
    const allTags = [...new Set(notes.flatMap(n => extractTagsFromHtml(n.content)))];
    const tagBar = document.getElementById('tagBar');
    tagBar.innerHTML = allTags.map(t => `<button class="tag-chip ${activeTagFilter===t?'active':''}" onclick="filterByTag('${t}')">#${t}</button>`).join('');

    // 노트 목록
    const list = document.getElementById('noteList');
    if (!filtered.length) {
      list.innerHTML = `<div class="list-section-label">노트</div><div style="padding:20px 10px; font-size:13px; color:var(--text-3); text-align:center">${q?'검색 결과 없음':'노트가 없어요'}</div>`;
      return;
    }
    list.innerHTML = `<div class="list-section-label">노트 ${filtered.length}개</div>` +
      filtered.map(n => {
        const isActive = n.id === currentNoteId;
        const date = formatDate(n.updated_at && n.updated_at !== n.created_at ? n.updated_at : n.created_at);
        const colorDot = n.color ? `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${n.color};margin-right:4px"></span>` : '';
        return `
          <div class="note-item ${isActive?'active':''}" onclick="openNote('${n.id}')">
            <div class="note-item-title">${escHtml(n.title||'제목 없음')}</div>
            <div class="note-item-meta">${colorDot}${date}</div>
            <button class="note-item-del" onclick="deleteNote('${n.id}', event)" title="삭제">✕</button>
          </div>
        `;
      }).join('');
  }

  // ── 토스트 ──────────────────────────────────────────────
  function showToast(msg, isErr=false) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show'+(isErr?' err':'');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.className='toast', 2500);
  }
  window.showToast = showToast;

  // ── Auth ─────────────────────────────────────────────────
  window.switchTab = function(mode) {
    isLoginMode = (mode==='login');
    document.getElementById('loginTab').classList.toggle('active', isLoginMode);
    document.getElementById('signupTab').classList.toggle('active', !isLoginMode);
    document.getElementById('authBtn').textContent = isLoginMode ? '로그인' : '회원가입';
    document.getElementById('authError').textContent = '';
  };

  window.doAuth = async function() {
    const email = document.getElementById('authEmail').value.trim();
    const pw    = document.getElementById('authPw').value;
    const btn   = document.getElementById('authBtn');
    const errEl = document.getElementById('authError');
    if (!email||!pw) { errEl.textContent='이메일과 비밀번호를 입력해주세요'; return; }
    if (pw.length<6)  { errEl.textContent='비밀번호는 6자 이상이어야 해요'; return; }
    btn.disabled=true; btn.textContent='처리 중...'; errEl.textContent='';
    const { error } = isLoginMode
      ? await sb.auth.signInWithPassword({ email, password: pw })
      : await sb.auth.signUp({ email, password: pw });
    btn.disabled=false; btn.textContent=isLoginMode?'로그인':'회원가입';
    if (error) errEl.textContent = error.message.includes('Invalid') ? '이메일 또는 비밀번호가 틀렸어요' : error.message;
  };

  document.getElementById('authPw').addEventListener('keydown', e => { if (e.key==='Enter') window.doAuth(); });
  window.logout = async function() { await sb.auth.signOut(); };

  sb.auth.onAuthStateChange((event, session) => {
    if (session?.user) {
      currentUser = session.user;
      const emailShort = currentUser.email.split('@')[0];
      document.getElementById('userEmail').textContent = currentUser.email;
      document.getElementById('userAvatar').textContent = emailShort[0].toUpperCase();
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initEditor();
      loadNotes();
    } else {
      currentUser=null; notes=[]; currentNoteId=null;
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  // 컨텍스트 메뉴 외부 클릭
  window.hideCtxMenu = function() { document.getElementById('ctxMenu').classList.remove('show'); };
</script>
